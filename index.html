<!DOCTYPE html>
<html lang="es">

<head>

       del idioma español -->

  <!-- Hace que la página se adapte

      <span class="tag">Widget 08</span>

      <span class="placeholder">
        Contenido pendiente
      </span>

    </div>

  </main>


  <!-- Cargamos primero el archivo que contiene
       el contenido del conversor -->

  <!-- Después cargamos el archivo que contiene
       el funcionamiento del conversor -->

  <!-- Ejecutamos el conversor dentro de widget-2 -->

    // Montamos el conversor en el widget 2.
    mountConverterWidget('widget-6');

</html>
