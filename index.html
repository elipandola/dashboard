<!DOCTYPE html>
<html lang="es">

<head>
  <!-- Permite utilizar caracteres especiales -->
  <meta charset="UTF-8">

  <!-- Hace que la página sea adaptable -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <!-- Nombre de la página -->
  <title>Panel</title>

  <!-- Conexión con Google Fonts -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <!-- Tipografías del proyecto -->
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Inter:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <!-- Archivo de estilos -->
  <link
    rel="stylesheet"
    href="styles.css"
  >
</head>

<body>

  <!-- Nubes decorativas -->
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>

  <!-- Encabezado -->
  <header>
    <h1>Panel</h1>
  </header>

  <!-- Panel principal -->
  <main class="panel">

    <!-- Widget 1 -->
    <div class="widget" id="widget-1">
      <span class="tag">
        Widget 01
      </span>

      <span class="placeholder">
        Contenido pendiente
      </span>
    </div>

    <!-- Widget 2 -->
    <div class="widget" id="widget-2">
      <span class="tag">
        Widget 02
      </span>

      <span class="placeholder">
        Contenido pendiente
      </span>
    </div>

    <!-- Widget 3 -->
    <div class="widget" id="widget-3">
      <span class="tag">
        Widget 03
      </span>

      <span class="placeholder">
        Contenido pendiente
      </span>
    </div>

    <!-- Widget 4 -->
    <div class="widget" id="widget-4">
      <span class="tag">
        Widget 04
      </span>

      <span class="placeholder">
        Contenido pendiente
      </span>
    </div>

    <!-- Widget 5 -->
    <div class="widget" id="widget-05">
      <span class="tag">
        Widget 05
      </span>

      <span class="placeholder">
        Contenido pendiente
      </span>
    </div>

    <!-- Widget 6 -->
    <div class="widget" id="widget-6">
      <span class="tag">
        CONVERSOR
      </span>

      <span class="placeholder">
        Contenido pendiente
      </span>
    </div>

    <!-- Widget 7 -->
    <div class="widget" id="widget-7">
      <span class="tag">
        Widget 07
      </span>

      <span class="placeholder">
        Contenido pendiente
      </span>
    </div>

    <!-- Widget 8 -->
    <div class="widget" id="widget-8">
      <span class="tag">
        Widget 08
      </span>

      <span class="placeholder">
        Contenido pendiente
      </span>
    </div>

  </main>


  <!-- CONVERSOR -->
  <script src="converter-content.js"></script>
  <script src="converter-widget.js"></script>

  <script>
    mountConverterWidget('widget-6');
  </script>


  <!-- NOTICIAS -->
  <script src="noticias-widget-v3.js"></script>

  <script>
    mountNewsWidget('widget-1');
  </script>


  <!-- POMODORO -->
  <script src="pomodoro-widget.js"></script>

  <script>
    mountPomodoroWidget('widget-8');
  </script>


  <!-- LISTA DE TAREAS -->
  <script src="todo-widget.js"></script>

  <script>
    mountTodoWidget('widget-2');
  </script>


  <!-- CALCULADORA -->
  <script src="calculator-widget.js"></script>

  <script>
    mountCalculatorWidget('widget-3');
  </script>


  <!-- DICCIONARIO -->
  <script src="dictionary-widget.js"></script>

  <script>
    mountDictionaryWidget('widget-4');
  </script>


  <!-- RELOJ -->
  <script src="clock-widget.js"></script>

  <script>
    mountClockWidget('widget-05');
  </script>

</body>
</html>
